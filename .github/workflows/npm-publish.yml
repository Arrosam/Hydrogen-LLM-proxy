name: Publish packages (npm)

# Publishes the @areelai/* packages on every version tag. The tag must match
# the version in the package manifests (all packages move in lockstep), and
# the repository needs an NPM_TOKEN secret: a granular npm access token with
# publish rights on the @areelai scope.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./packages/common/package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag v$TAG does not match package version $VERSION" >&2
            exit 1
          fi

      - name: Build packages
        run: npm run build:packages

      - name: Test
        run: npm test

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for p in common wire-format supplier-management user-management model-services micro-agent; do
            npm publish --workspace "packages/$p" --access public
          done
