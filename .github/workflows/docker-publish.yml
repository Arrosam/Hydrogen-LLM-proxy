name: Publish Docker images (GHCR)

# Builds three images and pushes them to the GitHub Container Registry:
#   ghcr.io/<owner>/hydrogen-llm-proxy:<tag>            gateway + console (all-in-one; Rainyun, docker compose)
#   ghcr.io/<owner>/hydrogen-llm-proxy:<tag>-api        gateway only
#   ghcr.io/<owner>/hydrogen-llm-proxy:<tag>-console    console only (forwards to BACKEND_URL)
#
# No extra secrets required - the built-in GITHUB_TOKEN can push to GHCR.
# After the first successful run, make the package Public once:
#   GitHub -> your profile -> Packages -> hydrogen-llm-proxy
#   -> Package settings -> Change visibility -> Public

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata (all-in-one)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Derive image metadata (api)
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=-api,onlatest=true
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Derive image metadata (console)
        id: meta_console
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=-console,onlatest=true
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      # Rainyun runs an amd64 Kubernetes cluster; build linux/amd64 by default.
      # Add linux/arm64 to `platforms` if you also need ARM (slower: native
      # modules compile under QEMU).
      - name: Build and push (all-in-one)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-to: type=gha,mode=max

      - name: Build and push (api)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime-api
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          cache-from: type=gha
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Build and push (console)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/console/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_console.outputs.tags }}
          labels: ${{ steps.meta_console.outputs.labels }}
          cache-from: type=gha
